const weekColors={1:"purple",2:"purple",3:"teal",4:"teal",5:"teal",6:"amber",7:"amber",8:"coral"};
const typeLabels={learn:"Learn",build:"Build",setup:"Setup",project:"Project",plan:"Plan",ship:"Ship",prep:"Prep",reflect:"Reflect"};
const typeColors={learn:"purple",build:"teal",setup:"blue",project:"coral",plan:"amber",ship:"green",prep:"amber",reflect:"purple"};

let openDays=new Set();

function phaseForWeek(w){
  return PHASES.find(p=>p.weeks.includes(w));
}

function buildAll(){
  const container=document.getElementById('view-all');
  let html='';
  let lastPhaseId='';
  let lastWeek=0;
  DAYS.forEach((day,i)=>{
    const phase=phaseForWeek(day.w);
    const pc=C[phase.color];
    const wc=C[weekColors[day.w]];
    const tc=C[typeColors[day.type]]||C.purple;
    if(phase.id!==lastPhaseId){
      if(lastPhaseId) html+=`</div>`;
      html+=`<div class="phase-header"><p class="phase-label">${phase.label}</p><p class="phase-title">${phase.title}</p></div><div>`;
      lastPhaseId=phase.id;
    }
    if(day.w!==lastWeek){
      html+=`<p class="week-label">Week ${day.w}</p>`;
      lastWeek=day.w;
    }
    html+=`<div class="day-card">
      <div class="day-header" onclick="toggleDay(${i})">
        <div class="day-num" style="background:${wc.f};color:${wc.t};border:0.5px solid ${wc.s}">${day.d}</div>
        <div class="day-info">
          <p class="day-title">${day.title}</p>
          <p class="day-sub">${day.sub}</p>
        </div>
        <div class="day-tags">
          <span class="tag" style="background:${tc.f};border-color:${tc.s};color:${tc.t}">${typeLabels[day.type]}</span>
        </div>
        <i class="ti ti-chevron-down chev" id="chev-${i}" aria-hidden="true"></i>
      </div>
      <div class="day-body" id="body-${i}">
        <p class="sec-lbl">Today's tasks</p>
        <ul class="task-list">${day.tasks.map(t=>`<li><span class="dot" style="background:${wc.d}"></span>${t}</li>`).join('')}</ul>
        ${day.resources.length?`<p class="sec-lbl">Resources</p><div>${day.resources.map(r=>`<span class="res-chip">${r}</span>`).join('')}</div>`:''}
        ${day.project?`<p class="sec-lbl">Project deliverable</p><div class="project-block" style="background:${C[day.project.color].f};border-color:${C[day.project.color].s}"><p style="font-size:13px;font-weight:500;color:${C[day.project.color].t};margin:0 0 3px">${day.project.title}</p><p style="font-size:13px;color:${C[day.project.color].t};margin:0;line-height:1.5;opacity:.85">${day.project.desc}</p></div>`:''}
        <div class="tip-block"><i class="ti ti-bulb" style="font-size:16px;flex-shrink:0;margin-top:1px" aria-hidden="true"></i><span>${day.tip}</span></div>
      </div>
    </div>`;
  });
  html+=`</div>`;
  container.innerHTML=html;
}

function buildProgress(){
  const strip=document.getElementById('progressStrip');
  let html='';
  PHASES.forEach(p=>{
    const c=C[p.color];
    const count=DAYS.filter(d=>phaseForWeek(d.w).id===p.id).length;
    for(let i=0;i<count;i++){
      html+=`<div class="progress-seg" style="background:${c.d}" title="${p.title}"></div>`;
    }
  });
  strip.innerHTML=html;
}

function buildTopNav(){
  const nav=document.getElementById('topNav');
  let html=`<div class="tnav active" onclick="switchMain('all',this)">All 56 days</div>`;
  PHASES.forEach(p=>{
    html+=`<div class="tnav" onclick="switchMain('${p.id}',this)">${p.label}: ${p.title.split('—')[0].trim()}</div>`;
  });
  html+=`<div class="tnav" onclick="switchMain('search',this)"><i class="ti ti-search" aria-hidden="true"></i> Search</div>`;
  nav.innerHTML=html;
}

function switchMain(id,el){
  document.querySelectorAll('.tnav').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(id==='search'){
    document.getElementById('view-all').style.display='none';
    document.getElementById('view-search').style.display='block';
    setTimeout(()=>document.getElementById('searchInput').focus(),100);
    return;
  }
  document.getElementById('view-all').style.display='block';
  document.getElementById('view-search').style.display='none';
  if(id==='all'){
    document.querySelectorAll('.day-card,.phase-header,.week-label,div').forEach(el=>{});
    document.getElementById('view-all').querySelectorAll('.day-card').forEach(c=>c.style.display='');
    document.getElementById('view-all').querySelectorAll('.phase-header').forEach(c=>c.style.display='');
    document.getElementById('view-all').querySelectorAll('.week-label').forEach(c=>c.style.display='');
    return;
  }
  const targetPhase=PHASES.find(p=>p.id===id);
  if(!targetPhase) return;
  document.getElementById('view-all').querySelectorAll('.day-card').forEach((card,i)=>{
    const day=DAYS[i];
    const phase=phaseForWeek(day.w);
    card.style.display=phase.id===id?'':'none';
  });
  document.getElementById('view-all').querySelectorAll('.phase-header').forEach((ph,i)=>{
    ph.style.display=PHASES[i]&&PHASES[i].id===id?'':'none';
  });
  document.getElementById('view-all').querySelectorAll('.week-label').forEach(wl=>{
    const wNum=parseInt(wl.textContent.replace('Week ',''));
    const phase=phaseForWeek(wNum);
    wl.style.display=phase.id===id?'':'none';
  });
}

function toggleDay(i){
  const body=document.getElementById(`body-${i}`);
  const chev=document.getElementById(`chev-${i}`);
  if(openDays.has(i)){openDays.delete(i);body.classList.remove('open');chev.classList.remove('open');}
  else{openDays.add(i);body.classList.add('open');chev.classList.add('open');}
}

function doSearch(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  const res=document.getElementById('searchResults');
  if(q.length<2){res.innerHTML='<p style="font-size:13px;color:var(--color-text-secondary)">Type at least 2 characters to search</p>';return;}
  const matches=DAYS.filter(d=>
    d.title.toLowerCase().includes(q)||
    d.sub.toLowerCase().includes(q)||
    d.tasks.some(t=>t.toLowerCase().includes(q))||
    d.resources.some(r=>r.toLowerCase().includes(q))
  );
  if(!matches.length){res.innerHTML='<p style="font-size:13px;color:var(--color-text-secondary)">No days found for that search</p>';return;}
  const wc_map=i=>C[weekColors[DAYS[i].w]];
  res.innerHTML=matches.map(day=>{
    const idx=DAYS.indexOf(day);
    const wc=C[weekColors[day.w]];
    const tc=C[typeColors[day.type]]||C.purple;
    const matchingTasks=day.tasks.filter(t=>t.toLowerCase().includes(q));
    return `<div class="day-card">
      <div class="day-header" onclick="toggleDay(${idx})">
        <div class="day-num" style="background:${wc.f};color:${wc.t};border:0.5px solid ${wc.s}">${day.d}</div>
        <div class="day-info"><p class="day-title">${day.title}</p><p class="day-sub">Week ${day.w} · ${day.sub}</p></div>
        <span class="tag" style="background:${tc.f};border-color:${tc.s};color:${tc.t}">${typeLabels[day.type]}</span>
        <i class="ti ti-chevron-down chev" id="chev-${idx}" aria-hidden="true"></i>
      </div>
      <div class="day-body" id="body-${idx}">
        ${matchingTasks.length?`<p class="sec-lbl">Matching tasks</p><ul class="task-list">${matchingTasks.map(t=>`<li><span class="dot" style="background:${wc.d}"></span>${t}</li>`).join('')}</ul>`:''}
        <p class="sec-lbl">All resources</p><div>${day.resources.map(r=>`<span class="res-chip">${r}</span>`).join('')}</div>
        <div class="tip-block"><i class="ti ti-bulb" style="font-size:16px;flex-shrink:0" aria-hidden="true"></i><span>${day.tip}</span></div>
      </div>
    </div>`;
  }).join('');
}

buildTopNav();
buildProgress();
buildAll();
document.getElementById('view-search').style.display='none';
</script>
